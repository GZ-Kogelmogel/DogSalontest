<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Nie znaleziono strony | Psistań">
<link rel="icon" href="./favicon.ico" type="image/x-icon">
<title>Nie znaleziono strony | Psistań</title>
<style>
:root{--paper:#fff9f5;--ink:#342820;--pink:#a94f67;--line:#e9dbd3;--button:#342820;--button-ink:#fff9f5}
[data-theme="dark"]{--paper:#211a18;--ink:#fff8f2;--pink:#f0bac7;--line:#51413b;--button:#fff8f2;--button-ink:#342820}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:400 20px/1.5 Georgia,serif}
.box{max-width:620px;padding:40px;text-align:center}
.n{font:700 13px Arial,sans-serif;letter-spacing:.15em;color:var(--pink);text-transform:uppercase}
h1{font-size:clamp(42px,7vw,76px);line-height:1;margin:22px 0}
a{display:inline-block;margin-top:18px;padding:14px 20px;background:var(--button);color:var(--button-ink);font:700 14px Arial,sans-serif;text-decoration:none}
a:hover{opacity:.88}
</style>
<script>
(function(){
  try {
    var savedTheme = localStorage.getItem('psistan-theme');
    var theme = savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
  } catch(e) {}
})();
</script>
</head>
<body>
<!-- You found the salon dog. 🐕
 / \__
(    @\___
 /         O
/   (_____/
/_____/   U
-->
<main class="box">
<p class="n">Błąd 404</p>
<h1>Nie mogliśmy wywęszyć tej strony!</h1>
<p>Może wróćmy na znany trop.</p>
<a id="home" href="./index.html">Wróć na stronę główną</a>
</main>

</body>
</html>
